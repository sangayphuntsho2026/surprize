<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surprise Ready · Surprize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kameron:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-active="order">
<div class="app">
  <aside class="sidebar" id="side"></aside>
  <div class="main">
    <header class="topbar" id="top"></header>
    <main class="content">

<div id="steps"></div>
<div class="card center success" id="box"></div>
    </main>
  </div>
</div>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>

if (S.requireLogin()) {
  const o = S.order(S.qs('id'));
  if (!o) UI.go('orders.html');
  else {
    document.getElementById('steps').innerHTML = UI.stepper(4);
    document.getElementById('box').innerHTML = `<div class="big">🎉</div><h1>Your surprise is ready!</h1>
      <p><b>${S.esc(o.title)}</b> will be delivered on <b>${S.fdate(o.date)}</b> to ${S.esc(o.rname)}.</p>
      <p class="muted">Order #${o.id} · ${S.money(o.total)} · ${S.esc(o.payment ? o.payment.status : 'Not paid yet')}</p>
      <a class="btn" href="orders.html">Track my order</a> <a class="btn btn-ghost" href="plan.html?new=1">Plan another surprise</a>`;
  }
}
</script>
</body>
</html>
