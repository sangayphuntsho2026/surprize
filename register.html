<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up · Surprize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kameron:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-active="">
<div class="app">
  <aside class="sidebar" id="side"></aside>
  <div class="main">
    <header class="topbar" id="top"></header>
    <main class="content">

<div class="auth-wrap">
  <form class="card auth" id="f">
    <h1>Create your account</h1>
    <p class="muted">It only takes a minute.</p>
    <label>Full name<input name="name" required maxlength="100"></label>
    <label>Email<input type="email" name="email" required></label>
    <label>Phone number<input name="phone" required placeholder="+975 17xxxxxx"></label>
    <label>Password<input type="password" name="password" required minlength="6"></label>
    <label>Confirm password<input type="password" name="password2" required minlength="6"></label>
    <button class="btn btn-block" type="submit">Sign up</button>
    <p class="muted center">Already have an account? <a href="login.html">Log in</a></p>
  </form>
</div>
    </main>
  </div>
</div>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>

if (S.user()) location.replace('index.html');
document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  const f = e.target;
  const err = S.register({name:f.name.value, email:f.email.value, phone:f.phone.value, password:f.password.value, password2:f.password2.value});
  if (err) return UI.flash(err, 'error');
  UI.flashNext('Account created. Welcome to Surprize!', 'ok');
  const to = sessionStorage.getItem('after_login'); sessionStorage.removeItem('after_login');
  UI.go(to || 'index.html');
};
</script>
</body>
</html>
