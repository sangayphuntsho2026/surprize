<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register · Surprize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kameron:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-active="">
<div class="app">
  <aside class="sidebar" id="side"></aside>
  <div class="main">
    <header class="topbar" id="top"></header>
    <main class="content">

<div class="auth-wrap">
  <form class="card auth" id="f">
    <h1>Create your account</h1>
    <p class="muted">Start planning your next surprize.</p>
    <label>Full name<input type="text" name="name" required autofocus></label>
    <label>Email<input type="email" name="email" required></label>
    <label>Phone<input type="tel" name="phone" required></label>
    <label>Password<input type="password" name="password" minlength="6" required></label>
    <label>Confirm password<input type="password" name="password2" minlength="6" required></label>
    <button class="btn btn-block" type="submit">Create account</button>
    <p class="muted center">Already have an account? <a href="login.html">Log in</a></p>
  </form>
</div>
    </main>
  </div>
</div>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const f = e.target;
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: f.name.value,
        email: f.email.value,
        phone: f.phone.value,
        password: f.password.value,
        password2: f.password2.value
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Request failed');
    UI.go('index.html');
  } catch (err) {
    UI.flash(err.message, 'error');
  }
};
</script>
</body>
</html>
