<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard | Surprize</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root {
      --ad-ink:#252044;
      --ad-muted:#77738f;
      --ad-purple:#7047d8;
      --ad-line:#e8e2f5;
      --ad-bg:#f1effb;
    }

    body {
      background:linear-gradient(135deg,#f4f0ff 0%,#eef5ff 48%,#fff1f7 100%);
      background-attachment:fixed;
      color:var(--ad-ink);
      font-size:16px;
    }

    .admin-wrap { min-height:100vh; }

    .admin-login {
      max-width:440px;
      margin:7vh auto;
      padding:34px;
      background:linear-gradient(145deg,#fff,#fbf9ff);
      border:1px solid #e5dcff;
      border-radius:22px;
      box-shadow:0 22px 65px #5940a51f;
      position:relative;
      overflow:hidden;
    }

    .admin-login:before {
      content:"";
      position:absolute;
      left:0;right:0;top:0;height:8px;
      background:linear-gradient(90deg,#7047d8,#3b82f6,#ec4899,#f59e0b);
    }

    .brand-mark {
      font-size:30px;
      font-weight:900;
      color:#7047d8;
      margin-bottom:8px;
    }

    .admin-login h1 { font-size:28px;margin:8px 0; }
    .admin-login p,.muted { color:var(--ad-muted); }

    .admin-login label,.field label {
      display:block;
      font-weight:700;
      margin:15px 0 7px;
    }

    .admin-login input,
    .field input,
    .field select,
    .field textarea,
    .toolbar input,
    .toolbar select {
      width:100%;
      padding:13px 14px;
      border:1px solid #dcd9e8;
      border-radius:11px;
      background:#fff;
      font:inherit;
      color:var(--ad-ink);
      box-sizing:border-box;
    }

    .admin-btn {
      border:0;
      border-radius:11px;
      padding:12px 17px;
      background:linear-gradient(135deg,#7047d8,#8b5cf6);
      color:#fff;
      font-weight:800;
      cursor:pointer;
      font-size:15px;
      box-shadow:0 5px 13px #7047d82b;
      transition:transform .18s,box-shadow .18s;
    }

    .admin-btn:hover {
      transform:translateY(-1px);
      box-shadow:0 8px 18px #7047d83b;
    }

    .admin-btn.secondary {
      background:#eee8ff;
      color:#5b36b7;
      box-shadow:none;
    }

    .admin-btn.danger {
      background:#fff0f0;
      color:#b42318;
    }

    .admin-btn.full { width:100%;margin-top:20px; }

    .demo-hint {
      background:linear-gradient(120deg,#f0eaff,#eaf3ff);
      border:1px solid #e3d9ff;
      border-radius:12px;
      padding:12px 14px;
      font-size:13px;
      margin-top:18px;
      line-height:1.7;
    }

    .error { color:#b42318;min-height:22px;margin-top:10px; }

    .admin-shell {
      display:grid;
      grid-template-columns:255px minmax(0,1fr);
      min-height:100vh;
    }

    .admin-side {
      background:linear-gradient(180deg,#21183f 0%,#34245f 55%,#493078 100%);
      box-shadow:8px 0 28px #30205b18;
      color:#fff;
      padding:27px 18px;
      display:flex;
      flex-direction:column;
      gap:26px;
    }

    .admin-side .brand-mark { color:#fff;padding:0 12px; }

    .side-caption {
      font-size:11px;
      letter-spacing:1.5px;
      color:#c2b5e7;
      padding:0 13px;
      text-transform:uppercase;
    }

    .side-nav { display:grid;gap:7px; }

    .side-nav button {
      border:0;
      background:transparent;
      color:#d9d3e8;
      text-align:left;
      padding:13px 14px;
      border-radius:11px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      transition:background .18s,transform .18s;
    }

    .side-nav button.active,
    .side-nav button:hover {
      background:linear-gradient(100deg,#7652d7,#9668e8);
      color:#fff;
      box-shadow:0 5px 14px #130d2c38;
      transform:translateX(2px);
    }

    .side-bottom { margin-top:auto; }

    .admin-main {
      min-width:0;
      padding:28px 34px 50px;
      background:linear-gradient(135deg,#f6f3ffb8,#eef5ffb8);
    }

    .admin-content { max-width:1400px;margin:auto; }

    .admin-top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:28px;
    }

    .admin-top h1 { font-size:30px;margin:0;color:#2c2050; }
    .admin-top p { margin:6px 0 0;color:var(--ad-muted); }

    .stats-grid {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:17px;
      margin-bottom:22px;
    }

    .stat-card,.panel {
      background:#ffffffed;
      border:1px solid #e8e2f5;
      border-radius:17px;
      padding:21px;
      box-shadow:0 8px 24px #35235f0c;
    }

    .stat-card {
      position:relative;
      overflow:hidden;
      min-height:128px;
    }

    .stat-card:after {
      content:"";
      position:absolute;
      left:0;top:0;bottom:0;
      width:5px;
      background:#8b5cf6;
    }

    .stats-grid .stat-card:nth-child(1) { background:linear-gradient(135deg,#fff,#f1eaff); }
    .stats-grid .stat-card:nth-child(1):after { background:#8b5cf6; }
    .stats-grid .stat-card:nth-child(2) { background:linear-gradient(135deg,#fff,#eaf3ff); }
    .stats-grid .stat-card:nth-child(2):after { background:#3b82f6; }
    .stats-grid .stat-card:nth-child(3) { background:linear-gradient(135deg,#fff,#fff1e7); }
    .stats-grid .stat-card:nth-child(3):after { background:#f59e0b; }
    .stats-grid .stat-card:nth-child(4) { background:linear-gradient(135deg,#fff,#e8fbf3); }
    .stats-grid .stat-card:nth-child(4):after { background:#10b981; }

    .stat-card .stat-label {
      color:var(--ad-muted);
      font-weight:700;
      font-size:14px;
    }

    .stat-card strong {
      display:block;
      font-size:29px;
      margin-top:10px;
      color:#2d2450;
    }

    .stat-icon {
      font-size:23px;
      float:right;
      background:#f1edfc;
      border-radius:11px;
      padding:9px;
    }

    .stats-grid .stat-card:nth-child(1) .stat-icon { background:#e8ddff;color:#7047d8; }
    .stats-grid .stat-card:nth-child(2) .stat-icon { background:#dcecff;color:#2563eb; }
    .stats-grid .stat-card:nth-child(3) .stat-icon { background:#ffead3;color:#c27608; }
    .stats-grid .stat-card:nth-child(4) .stat-icon { background:#d9f7e9;color:#078653; }

    .panel { margin-bottom:20px;border-radius:19px; }
    .panel h2 { font-size:19px;margin:0;color:#302451; }

    .panel-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:17px;
    }

    .toolbar {
      display:flex;
      gap:10px;
      align-items:center;
      margin-bottom:15px;
    }

    .toolbar input { max-width:340px; }

    .table-wrap { overflow-x:auto; }

    table {
      width:100%;
      border-collapse:collapse;
      min-width:680px;
    }

    th,td {
      text-align:left;
      padding:14px 12px;
      border-bottom:1px solid #f0eef5;
      font-size:14px;
      vertical-align:middle;
    }

    th {
      color:var(--ad-muted);
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.6px;
      background:#f7f4ff;
    }

    td strong { font-size:14px; }
    tbody tr:hover { background:#faf8ff; }

    .pill {
      display:inline-block;
      padding:6px 10px;
      border-radius:30px;
      background:#eee8ff;
      color:#5b36b7;
      font-size:12px;
      font-weight:800;
    }

    .pill.green { background:#e8f7ee;color:#187443; }
    .pill.orange { background:#fff4df;color:#9b6500; }
    .pill.red { background:#fff0f0;color:#b42318; }
    .pill.blue { background:#e6f0ff;color:#1d4ed8; }

    .actions { display:flex;gap:7px;flex-wrap:wrap; }

    .small-btn {
      border:0;
      border-radius:8px;
      padding:8px 10px;
      cursor:pointer;
      font-weight:700;
      background:#eee8ff;
      color:#5c40ad;
    }

    .small-btn.red { background:#fff0f0;color:#b42318; }
    .small-btn.accept { background:#e8f7ee;color:#187443; }

    .empty {
      text-align:center;
      color:var(--ad-muted);
      padding:35px 10px;
    }

    .field-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:0 16px;
    }

    .field.full { grid-column:1/-1; }
    .field textarea { min-height:85px;resize:vertical; }

    /* Product image */
    .img-upload {
      display:flex;
      align-items:center;
      gap:14px;
      padding:12px;
      border:1px dashed #cfc5ef;
      border-radius:12px;
      background:#faf8ff;
    }
    .img-preview {
      width:84px;height:84px;
      flex:0 0 84px;
      border-radius:12px;
      background:#eee8ff;
      display:grid;
      place-items:center;
      font-size:34px;
      overflow:hidden;
    }
    .img-preview img { width:100%;height:100%;object-fit:cover; }
    .img-upload-actions { display:flex;flex-direction:column;gap:7px;align-items:flex-start; }
    .img-upload-actions small { color:var(--ad-muted); }
    .prod-cell { display:flex;align-items:center;gap:12px; }
    .prod-thumb {
      width:52px;height:52px;
      flex:0 0 52px;
      border-radius:10px;
      background:#eee8ff;
      display:grid;
      place-items:center;
      font-size:24px;
      overflow:hidden;
    }
    .prod-thumb img { width:100%;height:100%;object-fit:cover; }

    .field input:focus,
    .field select:focus,
    .field textarea:focus,
    .admin-login input:focus,
    .toolbar input:focus {
      outline:3px solid #a78bfa55;
      border-color:#8b5cf6;
    }

    .form-actions {
      display:flex;
      gap:9px;
      justify-content:flex-end;
      margin-top:18px;
    }

    .report-grid {
      display:grid;
      grid-template-columns:1.4fr 1fr;
      gap:18px;
    }

    .bar-row {
      display:grid;
      grid-template-columns:105px 1fr 90px;
      gap:12px;
      align-items:center;
      margin:15px 0;
      font-size:13px;
    }

    .bar-track {
      height:12px;
      border-radius:20px;
      background:#f0eef5;
      overflow:hidden;
    }

    .bar-fill {
      height:100%;
      border-radius:20px;
      background:linear-gradient(90deg,#8d6be5,#b18cf4);
    }

    /* Notifications */
    .top-actions { display:flex;align-items:center;gap:12px; }
    .notif-wrap { position:relative; }

    .notif-btn {
      position:relative;
      width:46px;height:46px;
      border:1px solid var(--ad-line);
      border-radius:13px;
      background:#fff;
      font-size:20px;
      cursor:pointer;
      box-shadow:0 5px 14px #35235f10;
      transition:transform .18s;
    }

    .notif-btn:hover { transform:translateY(-1px); }

    .notif-badge {
      position:absolute;
      top:-6px;right:-6px;
      min-width:20px;height:20px;
      padding:0 5px;
      border-radius:20px;
      background:#ef4444;
      color:#fff;
      font-size:11px;
      font-weight:800;
      line-height:20px;
      text-align:center;
      border:2px solid #fff;
    }

    .notif-badge:empty { display:none; }

    .notif-panel {
      position:absolute;
      right:0;top:56px;
      width:min(350px,88vw);
      background:#fff;
      border:1px solid var(--ad-line);
      border-radius:16px;
      box-shadow:0 18px 45px #2b1b5030;
      z-index:15;
      overflow:hidden;
    }

    .notif-panel[hidden] { display:none; }

    .notif-head {
      padding:15px 17px;
      font-weight:800;
      border-bottom:1px solid #f0eef5;
      background:#f7f4ff;
    }

    .notif-item {
      display:flex;
      gap:12px;
      width:100%;
      padding:13px 17px;
      border:0;
      border-bottom:1px solid #f4f2f9;
      background:#fff;
      text-align:left;
      cursor:pointer;
      font:inherit;
      color:var(--ad-ink);
    }

    .notif-item:hover { background:#faf8ff; }
    .notif-item .ni-icon { font-size:20px; }
    .notif-item strong { display:block;font-size:14px; }
    .notif-item small { color:var(--ad-muted); }
    .notif-empty { padding:28px 16px;text-align:center;color:var(--ad-muted); }

    @media(max-width:900px) {
      .admin-shell { grid-template-columns:1fr; }
      .admin-side {
        padding:14px 16px;
        gap:10px;
        background:linear-gradient(100deg,#21183f,#493078);
      }
      .admin-side .brand-mark { padding:0; }
      .side-caption,.side-bottom { display:none; }
      .side-nav { display:flex;overflow-x:auto; }
      .side-nav button { white-space:nowrap;padding:10px 12px; }
      .admin-main {
        padding:22px 17px;
        background:linear-gradient(135deg,#f6f3ff,#eef5ff);
      }
      .stats-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .report-grid { grid-template-columns:1fr; }
    }

    @media(max-width:520px) {
      .admin-login { margin:20px 12px;padding:25px 20px; }
      .admin-top { align-items:flex-start; }
      .admin-top h1 { font-size:24px; }
      .stats-grid { gap:10px; }
      .stat-card { padding:15px; }
      .stat-card strong { font-size:23px; }
      .stat-icon { font-size:18px;padding:6px; }
      .field-grid { grid-template-columns:1fr; }
      .field.full { grid-column:auto; }
      .toolbar { align-items:stretch;flex-direction:column; }
      .toolbar input { max-width:none; }
      .admin-main { padding:18px 12px; }
      .admin-top { flex-wrap:wrap; }
    }
  </style>
</head>

<body>
<div class="admin-wrap" id="app"></div>

<script src="js/store.js"></script>
<script>
(() => {
  const app = document.getElementById('app');
  const esc = S.esc;
  const money = S.money;

  let page = 'dashboard';
  let search = '';

  const titles = {
    dashboard:'Dashboard',
    products:'Products',
    orders:'Orders',
    users:'Customers',
    reports:'Reports'
  };

  // Product categories shown in the Add/Edit Product dropdown.
  const PRODUCT_CATEGORIES = [
    'Flowers',
    'Cakes',
    'Chocolates',
    'Teddy Bears',
    'Gift Hampers',
    'Jewellery',
    'Personalised Gifts',
    'Surprise Boxes'
  ];

  const statusClass = s =>
    ['Delivered','Completed'].includes(s) ? 'green' :
    s === 'Cancelled' ? 'red' :
    ['Pending','Packaging','In Progress'].includes(s) ? 'orange' :
    ['Accepted','Confirmed','Dispatched'].includes(s) ? 'blue' : '';

  const date = v =>
    v ? new Date(v).toLocaleDateString('en-GB',{
      day:'2-digit',
      month:'short',
      year:'numeric'
    }) : '—';

  /* ---------- Notifications ---------- */

  function notifications() {
    const list = [];

    S.adminOrders().forEach(o => {
      if ((o.status || 'Pending') === 'Pending') {
        list.push({
          icon:'🛒',
          text:`New order #${o.id} awaiting acceptance`,
          sub:`${esc(o.email)} · ${money(o.total || 0)} · ${date(o.created)}`
        });
      }

      if (o.payment && o.payment.status === 'Awaiting verification') {
        list.push({
          icon:'💳',
          text:`Payment to verify for order #${o.id}`,
          sub:`${esc(o.email)} · ${money(o.total || 0)}`
        });
      }
    });

    return list;
  }

  function updateBell() {
    const badge = document.getElementById('notifBadge');
    const panel = document.getElementById('notifPanel');

    if (!badge || !panel) return;

    const n = notifications();

    badge.textContent = n.length
      ? (n.length > 99 ? '99+' : n.length)
      : '';

    panel.innerHTML =
      `<div class="notif-head">Notifications</div>` +
      (n.length
        ? n.slice(0,8).map(i => `
          <button class="notif-item" data-notif-go="orders">
            <span class="ni-icon">${i.icon}</span>
            <span>
              <strong>${i.text}</strong>
              <small>${i.sub}</small>
            </span>
          </button>
        `).join('')
        : `<div class="notif-empty">You're all caught up 🎉</div>`
      );
  }

  document.addEventListener('click', e => {
    const panel = document.getElementById('notifPanel');
    const btn = document.getElementById('notifBtn');

    if (!panel || !btn) return;

    if (btn.contains(e.target)) {
      panel.hidden = !panel.hidden;
      btn.setAttribute('aria-expanded',String(!panel.hidden));
      return;
    }

    const item = e.target.closest('[data-notif-go]');

    if (item) {
      page = item.dataset.notifGo;
      search = '';
      panel.hidden = true;
      btn.setAttribute('aria-expanded','false');
      render();
      return;
    }

    if (!panel.contains(e.target)) {
      panel.hidden = true;
      btn.setAttribute('aria-expanded','false');
    }
  });

  /* ---------- Login ---------- */

  function loginView() {
    app.innerHTML = `
      <section class="admin-login">
        <div class="brand-mark">
          Surprize<span style="color:#262238">.</span>
        </div>

        <p class="muted">ADMINISTRATION PORTAL</p>
        <h1>Welcome back</h1>
        <p>Sign in to manage your Surprize store.</p>

        <form id="loginForm">
          <label for="adminEmail">Email address</label>
          <input
            id="adminEmail"
            type="email"
            autocomplete="username"
            required
            placeholder="admin@surprize.bt"
          >

          <label for="adminPassword">Password</label>
          <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Enter admin password"
          >

          <div class="error" id="loginError" role="alert"></div>

          <button class="admin-btn full" type="submit">
            Sign in to dashboard
          </button>
        </form>


        <p style="margin:20px 0 0">
          <a href="index.html">← Back to customer website</a>
        </p>
      </section>
    `;

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();

      const ok = S.adminLogin(
        document.getElementById('adminEmail').value,
        document.getElementById('adminPassword').value
      );

      if (ok) {
        shell();
      } else {
        document.getElementById('loginError').textContent =
          'Incorrect admin email or password.';
      }
    });
  }

  /* ---------- Admin layout ---------- */

  function shell() {
    app.innerHTML = `
      <div class="admin-shell">

        <aside class="admin-side">
          <div class="brand-mark">
            Surprize<span style="color:#c5b5ff">.</span>
          </div>

          <div>
            <div class="side-caption">Workspace</div>

            <nav class="side-nav" aria-label="Admin navigation">
              <button data-page="dashboard">▦ &nbsp; Dashboard</button>
              <button data-page="products">◇ &nbsp; Products</button>
              <button data-page="orders">▤ &nbsp; Orders</button>
              <button data-page="users">♙ &nbsp; Customers</button>
              <button data-page="reports">▥ &nbsp; Reports</button>
            </nav>
          </div>

          <div class="side-bottom">
            <button class="side-nav" id="logoutBtn"
              style="width:100%;text-align:left">
              ↪ &nbsp; Sign out
            </button>
          </div>
        </aside>

        <main class="admin-main">
          <div class="admin-content">

            <header class="admin-top">
              <div>
                <h1 id="pageTitle">Dashboard</h1>
                <p>Welcome to your Surprize store administration.</p>
              </div>

              <div class="top-actions">
                <div class="notif-wrap">
                  <button
                    class="notif-btn"
                    id="notifBtn"
                    aria-label="Notifications"
                    aria-expanded="false"
                  >
                    🔔
                    <span class="notif-badge" id="notifBadge"></span>
                  </button>

                  <div class="notif-panel" id="notifPanel" hidden></div>
                </div>

                <a class="admin-btn secondary"
                  href="index.html"
                  style="text-decoration:none">
                  View website ↗
                </a>
              </div>
            </header>

            <section id="view"></section>
          </div>
        </main>
      </div>
    `;

    app.querySelectorAll('[data-page]').forEach(b => {
      b.addEventListener('click',() => {
        page = b.dataset.page;
        search = '';
        render();
      });
    });

    document.getElementById('logoutBtn').addEventListener('click',() => {
      S.adminLogout();
      loginView();
    });

    render();
  }

  /* ---------- Dashboard statistics ---------- */

  function stats() {
    const x = S.adminStats();

    return `
      <div class="stats-grid">

        <article class="stat-card">
          <span class="stat-icon">♙</span>
          <span class="stat-label">Total customers</span>
          <strong>${x.users}</strong>
        </article>

        <article class="stat-card">
          <span class="stat-icon">◇</span>
          <span class="stat-label">Total products</span>
          <strong>${x.products}</strong>
        </article>

        <article class="stat-card">
          <span class="stat-icon">▤</span>
          <span class="stat-label">Total orders</span>
          <strong>${x.orders}</strong>
        </article>

        <article class="stat-card">
          <span class="stat-icon">Nu.</span>
          <span class="stat-label">Verified revenue</span>
          <strong>${money(x.revenue)}</strong>
        </article>

      </div>
    `;
  }

  function dashboard() {
    const orders = S.adminOrders().slice(0,6);

    return `
      ${stats()}

      <div class="panel">
        <div class="panel-head">
          <h2>Recent orders</h2>
          <button class="admin-btn secondary" data-go="orders">
            View all orders
          </button>
        </div>

        ${orders.length
          ? orderTable(orders,false)
          : '<div class="empty">No orders yet. Customer orders will appear here.</div>'
        }
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Quick overview</h2>
        </div>

        <p class="muted">
          There are <strong>${S.adminStats().pending}</strong>
          orders waiting for your acceptance. Open the orders page
          to accept or reject them.
        </p>

        <button class="admin-btn" data-go="orders">
          Review pending orders
        </button>
      </div>
    `;
  }

  /* ---------- Orders table ---------- */

  function orderTable(rows, full = true) {
    return `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th>Occasion</th>
              <th>Total</th>
              <th>Status</th>
              ${full ? '<th>Payment</th><th>Update status</th>' : ''}
            </tr>
          </thead>

          <tbody>
            ${rows.map(o => `
              <tr>
                <td>
                  <strong>#${o.id}</strong><br>
                  <span class="muted">${date(o.created)}</span>
                </td>

                <td>${esc(o.email)}</td>
                <td>${esc(o.title || 'Surprise')}</td>
                <td><strong>${money(o.total || 0)}</strong></td>

                <td>
                  <span class="pill ${statusClass(o.status)}">
                    ${esc(o.status || 'Pending')}
                  </span>
                </td>

                ${full ? `
                  <td>
                    ${o.payment ? `
                      <select
                        aria-label="Update payment status for order ${o.id}"
                        data-payment-status="${o.id}"
                        style="padding:8px;border:1px solid #ddd8e9;border-radius:8px"
                      >
                        ${[
                          'Awaiting verification',
                          'Paid',
                          'Completed',
                          'Pay on delivery',
                          'Failed'
                        ].map(s => `
                          <option ${o.payment.status === s ? 'selected' : ''}>
                            ${s}
                          </option>
                        `).join('')}
                      </select>
                    ` : '<span class="muted">Not paid yet</span>'}
                  </td>

                  <td>
                    ${(o.status || 'Pending') === 'Pending' ? `
                      <div class="actions">
                        <button class="small-btn accept"
                          data-accept="${o.id}">
                          ✓ Accept
                        </button>

                        <button class="small-btn red"
                          data-reject="${o.id}">
                          ✕ Reject
                        </button>
                      </div>
                    ` : `
                      <select
                        aria-label="Update order ${o.id} status"
                        data-order-status="${o.id}"
                        style="padding:8px;border:1px solid #ddd8e9;border-radius:8px"
                      >
                        ${[
                          'Accepted',
                          'Packaging',
                          'Dispatched',
                          'Delivered',
                          'Cancelled'
                        ].map(s => `
                          <option ${o.status === s ? 'selected' : ''}>
                            ${s}
                          </option>
                        `).join('')}
                      </select>
                    `}
                  </td>
                ` : ''}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  /* ---------- Products ---------- */

  function productsView() {
    const rows = S.adminProducts().filter(p =>
      `${p.name} ${p.type} ${p.desc}`
        .toLowerCase()
        .includes(search.toLowerCase())
    );

    return `
      <div class="panel">

        <div class="panel-head">
          <h2>Product catalogue</h2>
          <button class="admin-btn" id="addProduct">
            + Add product
          </button>
        </div>

        <div class="toolbar">
          <input
            id="searchBox"
            placeholder="Search products..."
            value="${esc(search)}"
          >
        </div>

        ${rows.length ? `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody>
                ${rows.map(p => `
                  <tr>
                    <td>
                      <div class="prod-cell">
                        <div class="prod-thumb">
                          ${p.image
                            ? `<img src="${esc(p.image)}" alt="${esc(p.name)}">`
                            : esc(p.emoji || '🎁')}
                        </div>
                        <div>
                          <strong>${esc(p.name)}</strong><br>
                          <span class="muted">${esc(p.desc || '')}</span>
                        </div>
                      </div>
                    </td>

                    <td>${esc(p.type)}</td>
                    <td><strong>${money(p.price)}</strong></td>

                    <td>
                      <div class="actions">
                        <button class="small-btn" data-edit="${p.id}">
                          Edit
                        </button>

                        <button class="small-btn red" data-delete="${p.id}">
                          Delete
                        </button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        ` : `
          <div class="empty">No products match your search.</div>
        `}
      </div>

      <p class="muted">
        Changes are saved in this browser and will appear on the customer gift catalogue.
      </p>
    `;
  }

  /* ---------- Customers ---------- */

  function usersView() {
    const rows = S.adminUsers().filter(u =>
      `${u.name} ${u.email} ${u.phone}`
        .toLowerCase()
        .includes(search.toLowerCase())
    );

    return `
      <div class="panel">

        <div class="panel-head">
          <h2>Registered customers</h2>
          <span class="pill">${rows.length} customers</span>
        </div>

        <div class="toolbar">
          <input
            id="searchBox"
            placeholder="Search name, email or phone..."
            value="${esc(search)}"
          >
        </div>

        ${rows.length ? `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Phone</th>
                  <th>Joined</th>
                  <th>Orders</th>
                </tr>
              </thead>

              <tbody>
                ${rows.map(u => `
                  <tr>
                    <td>
                      <strong>${esc(u.name)}</strong><br>
                      <span class="muted">${esc(u.email)}</span>
                    </td>

                    <td>${esc(u.phone || '—')}</td>
                    <td>${date(u.joined)}</td>
                    <td><span class="pill">${u.orderCount}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        ` : `
          <div class="empty">No customers found.</div>
        `}
      </div>

      <p class="muted">
        Customer passwords are never displayed in this dashboard.
      </p>
    `;
  }

  /* ---------- Reports ---------- */

  function reportsView() {
    const all = S.adminOrders();
    const delivered = all.filter(o => o.status === 'Delivered');
    const paid = all.filter(o =>
      o.payment && /paid|completed/i.test(o.payment.status)
    );

    const statuses = [
      'Pending',
      'Accepted',
      'Packaging',
      'Dispatched',
      'Delivered',
      'Cancelled'
    ];

    const max = Math.max(
      1,
      ...statuses.map(s => all.filter(o => o.status === s).length)
    );

    return `
      ${stats()}

      <div class="report-grid">
        <div class="panel">
          <h2>Orders by status</h2>

          ${statuses.map(s => {
            const n = all.filter(o => o.status === s).length;

            return `
              <div class="bar-row">
                <span>${s}</span>

                <div class="bar-track">
                  <div class="bar-fill" style="width:${n / max * 100}%"></div>
                </div>

                <strong>${n}</strong>
              </div>
            `;
          }).join('')}
        </div>

        <div class="panel">
          <h2>Sales summary</h2>

          <p class="muted">
            Revenue from payments marked as paid or completed.
          </p>

          <h2 style="font-size:28px;margin:18px 0">
            ${money(S.adminStats().revenue)}
          </h2>

          <p>All orders: <strong>${all.length}</strong></p>
          <p>Delivered orders: <strong>${delivered.length}</strong></p>
          <p>Verified payments: <strong>${paid.length}</strong></p>
        </div>
      </div>

      <div class="panel">
        <h2>Important note</h2>

        <p class="muted">
          This demo records order and payment statuses in your browser.
          Revenue is only counted when a payment is marked Paid or Completed
          by the admin. No real payment provider is connected.
        </p>
      </div>
    `;
  }

  /* ---------- Render pages ---------- */

  function render() {
    if (!S.adminActive()) {
      loginView();
      return;
    }

    updateBell();

    document.getElementById('pageTitle').textContent = titles[page];

    app.querySelectorAll('[data-page]').forEach(b => {
      b.classList.toggle('active',b.dataset.page === page);
    });

    const view = document.getElementById('view');

    view.innerHTML =
      page === 'dashboard' ? dashboard() :
      page === 'products' ? productsView() :
      page === 'orders' ? `
        <div class="panel">
          <div class="panel-head">
            <h2>All customer orders</h2>
            <span class="pill">${S.adminOrders().length} total</span>
          </div>

          ${S.adminOrders().length
            ? orderTable(S.adminOrders())
            : '<div class="empty">No orders have been placed yet.</div>'
          }
        </div>
      ` :
      page === 'users' ? usersView() :
      reportsView();

    view.querySelectorAll('[data-go]').forEach(b => {
      b.addEventListener('click',() => {
        page = b.dataset.go;
        render();
      });
    });

    const box = view.querySelector('#searchBox');

    if (box) {
      box.addEventListener('input',e => {
        search = e.target.value;
        const pos = e.target.selectionStart;

        render();

        const next = document.getElementById('searchBox');

        if (next) {
          next.focus();
          next.setSelectionRange(pos,pos);
        }
      });
    }

    const add = view.querySelector('#addProduct');

    if (add) {
      add.addEventListener('click',() => productDialog());
    }

    view.querySelectorAll('[data-edit]').forEach(b => {
      b.addEventListener('click',() => {
        productDialog(
          S.adminProducts().find(p => p.id === Number(b.dataset.edit))
        );
      });
    });

    view.querySelectorAll('[data-delete]').forEach(b => {
      b.addEventListener('click',() => {
        const p = S.adminProducts().find(
          x => x.id === Number(b.dataset.delete)
        );

        if (p && confirm(`Delete ${p.name}?`)) {
          S.deleteProduct(p.id);
          render();
        }
      });
    });

    view.querySelectorAll('[data-order-status]').forEach(sel => {
      sel.addEventListener('change',() => {
        S.updateOrderStatus(sel.dataset.orderStatus,sel.value);
        render();
      });
    });

    view.querySelectorAll('[data-payment-status]').forEach(sel => {
      sel.addEventListener('change',() => {
        S.updatePaymentStatus(sel.dataset.paymentStatus,sel.value);
        render();
      });
    });

    view.querySelectorAll('[data-accept]').forEach(b => {
      b.addEventListener('click',() => {
        S.updateOrderStatus(b.dataset.accept,'Accepted');
        render();
      });
    });

    view.querySelectorAll('[data-reject]').forEach(b => {
      b.addEventListener('click',() => {
        if (confirm('Reject and cancel order #' + b.dataset.reject + '?')) {
          S.updateOrderStatus(b.dataset.reject,'Cancelled');
          render();
        }
      });
    });
  }

  /* ---------- Add / Edit product dialog ---------- */

  function productDialog(p = {}) {
    const editing = !!p.id;
    const wrap = document.createElement('div');

    wrap.style = `
      position:fixed;
      inset:0;
      background:#17112688;
      display:grid;
      place-items:center;
      padding:16px;
      z-index:20;
      overflow:auto;
    `;

    // Include an existing category if it is not in the standard list.
    const categories = [...PRODUCT_CATEGORIES];

    if (p.type && !categories.includes(p.type)) {
      categories.push(p.type);
    }

    wrap.innerHTML = `
      <form
        id="productForm"
        style="
          background:white;
          padding:25px;
          border-radius:18px;
          width:min(560px,100%);
          max-height:95vh;
          overflow:auto;
        "
      >

        <div class="panel-head">
          <h2>${editing ? 'Edit product' : 'Add a product'}</h2>
          <button type="button" class="small-btn" id="closeDialog">✕</button>
        </div>

        <div class="field-grid">

          <div class="field">
            <label for="productName">Product name</label>
            <input
              id="productName"
              name="name"
              required
              maxlength="80"
              value="${esc(p.name || '')}"
              placeholder="Enter product name"
            >
          </div>

          <div class="field">
            <label for="productType">Category</label>

            <select id="productType" name="type" required>
              <option value="">Select category</option>

              ${categories.map(type => `
                <option
                  value="${esc(type)}"
                  ${p.type === type ? 'selected' : ''}
                >
                  ${esc(type)}
                </option>
              `).join('')}
            </select>
          </div>

          <div class="field">
            <label for="productPrice">Price (Nu.)</label>
            <input
              id="productPrice"
              name="price"
              type="number"
              min="0"
              step="1"
              required
              value="${p.price ?? ''}"
              placeholder="Enter price"
            >
          </div>

          <div class="field">
            <label for="productEmoji">Emoji</label>
            <input
              id="productEmoji"
              name="emoji"
              maxlength="8"
              value="${esc(p.emoji || '🎁')}"
              placeholder="🎁"
            >
          </div>

          <div class="field full">
            <label for="productImage">Product image</label>
            <div class="img-upload">
              <div class="img-preview" id="imgPreview"></div>
              <div class="img-upload-actions">
                <input id="productImage" type="file" accept="image/*" hidden>
                <button type="button" class="small-btn" id="chooseImage">📷 Choose image</button>
                <button type="button" class="small-btn red" id="removeImage">Remove image</button>
                <small>JPG, PNG or WebP. It is resized automatically.</small>
              </div>
            </div>
          </div>

          <div class="field full">
            <label for="productDescription">Description</label>
            <textarea
              id="productDescription"
              name="desc"
              maxlength="220"
              placeholder="Enter product description"
            >${esc(p.desc || '')}</textarea>
          </div>

        </div>

        <div class="form-actions">
          <button type="button" class="admin-btn secondary" id="cancelDialog">
            Cancel
          </button>

          <button class="admin-btn" type="submit">
            ${editing ? 'Save changes' : 'Add product'}
          </button>
        </div>

        <div class="error" id="productError" role="alert"></div>
      </form>
    `;

    document.body.appendChild(wrap);

    const close = () => wrap.remove();

    /* ----- Product image ----- */
    let image = p.image || '';
    const fileInput = wrap.querySelector('#productImage');
    const preview = wrap.querySelector('#imgPreview');
    const removeBtn = wrap.querySelector('#removeImage');
    const errorBox = wrap.querySelector('#productError');

    const showPreview = () => {
      preview.innerHTML = image
        ? `<img src="${esc(image)}" alt="Product image preview">`
        : esc(wrap.querySelector('#productEmoji').value || '🎁');
      removeBtn.hidden = !image;
    };
    showPreview();

    wrap.querySelector('#productEmoji').addEventListener('input', () => { if (!image) showPreview(); });
    wrap.querySelector('#chooseImage').onclick = () => fileInput.click();
    removeBtn.onclick = () => { image = ''; fileInput.value = ''; showPreview(); };

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        errorBox.textContent = 'Please choose an image file.';
        return;
      }
      try {
        image = await resizeImage(file, 600, 0.8);
        errorBox.textContent = '';
        showPreview();
      } catch (err) {
        errorBox.textContent = 'Could not read that image. Please try another one.';
      }
    });

    wrap.querySelector('#closeDialog').onclick = close;
    wrap.querySelector('#cancelDialog').onclick = close;

    wrap.addEventListener('click',e => {
      if (e.target === wrap) close();
    });

    wrap.querySelector('#productForm').addEventListener('submit',e => {
      e.preventDefault();

      const f = new FormData(e.target);

      const err = S.saveProduct({
        id:p.id,
        name:f.get('name'),
        type:f.get('type'),
        price:f.get('price'),
        emoji:f.get('emoji'),
        desc:f.get('desc'),
        image
      });

      if (err) {
        wrap.querySelector('#productError').textContent = err;
        return;
      }

      close();
      render();
    });
  }

  /* ---------- Image helper ----------
     Shrinks the picture so it fits in browser storage (localStorage ≈ 5 MB). */

  function resizeImage(file, maxSize, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ---------- Start application ---------- */

  S.adminActive() ? shell() : loginView();

})();
</script>
</body>
</html>
